name: baybayingo
description: A Flutter project for BaybayinGo
publish_to: 'none' # This is a private project
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Optional: add packages you need
  cupertino_icons: ^1.0.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/BGoLogo.png
  fonts:
    - family: Baybayin
      fonts:
        - asset: assets/fonts/BaybayinSimpleTAWBID.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/BGoLogo.png"
